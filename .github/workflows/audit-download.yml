name: Verify GitHub Pages hardening

on:
  push:
    branches: [security/pages-hardening]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check archive and JavaScript
        run: |
          sha256sum -c checksums.txt
          unzip -tq qt_meteor_project.zip
          node --check script.js
          node --check metrika.js
          node --check python/docs.js
          node --input-type=module --check < presentation/presentation.js
          python3 - <<'PY'
          import re, subprocess
          pattern = re.compile(rb'-----BEGIN (?:[A-Z ]+ )?PRIVATE KEY-----|(?<![A-Za-z0-9+/])(?:gh[pousr]_[A-Za-z0-9_]{24,}|github_pat_[A-Za-z0-9_]{24,}|AIza[A-Za-z0-9_-]{30,}|(?:AKIA|ASIA)[A-Z0-9]{16}|sk-(?:proj-)?[A-Za-z0-9_-]{24,}|xox[baprs]-[0-9A-Za-z-]{12,})(?![A-Za-z0-9+/])')
          names = re.compile(r'(^|/)(?:\.env(?:\.|$)|\.DS_Store$)|\.(?:bak|orig|old|swp|pem|key)$', re.I)
          objects = subprocess.check_output(['git', 'rev-list', '--objects', 'HEAD']).decode().splitlines()
          inspected = 0
          for entry in objects:
              sha, _, path = entry.partition(' ')
              if not path:
                  continue
              if names.search(path):
                  print(f'Historical internal file candidate: {path}')
              if path.lower().endswith(('.png', '.jpg', '.jpeg', '.webp', '.zip')):
                  continue
              object_type = subprocess.check_output(['git', 'cat-file', '-t', sha]).strip()
              if object_type == b'blob':
                  inspected += 1
                  if pattern.search(subprocess.check_output(['git', 'cat-file', 'blob', sha])):
                      print(f'Historical secret candidate: {path} ({sha})')
          print(f'Scanned {inspected} unique non-image, non-ZIP historical blobs')
          PY
      - name: Build GitHub Pages with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_site
      - name: Verify published files and browser flows
        run: |
          test "$(cat _site/CNAME)" = pupsiks.pro
          test -f _site/.well-known/security.txt
          test -f _site/robots.txt
          test ! -e _site/SECURITY_SETUP.md
          test ! -e _site/_config.yml
          test ! -e _site/.github
          (cd _site && sha256sum -c checksums.txt)
          python3 -m http.server --bind 127.0.0.1 --directory _site 8765 &
          npm install --prefix "$RUNNER_TEMP/pages-browser" --no-save playwright@1.56.1
          "$RUNNER_TEMP/pages-browser/node_modules/.bin/playwright" install --with-deps chromium
          cat > "$RUNNER_TEMP/pages-browser/verify.cjs" <<'JS'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          const origin = 'http://127.0.0.1:8765';
          (async () => {
            const browser = await chromium.launch();
            try {
              const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, permissions: ['clipboard-read', 'clipboard-write'] });
              const errors = [];
              let analyticsRequests = 0;
              await context.route('https://mc.yandex.ru/metrika/tag.js?*', route => {
                analyticsRequests++;
                return route.fulfill({ contentType: 'text/javascript', body: '/* test response */' });
              });
              await context.addInitScript(() => {
                window.addEventListener('securitypolicyviolation', event => console.error('CSP: ' + event.violatedDirective + ' ' + event.blockedURI));
              });
              const page = await context.newPage();
              page.on('pageerror', error => errors.push(String(error)));
              page.on('console', message => { if (message.type() === 'error') { errors.push(message.text()); console.error(message.text().slice(0, 500)); } });
              const visit = async path => assert.equal((await page.goto(origin + path)).status(), 200);
              await visit('/');
              const presentations = page.locator('[data-panel=presentations] .panel-trigger');
              await presentations.hover();
              await page.getByRole('button', { name: 'Открыть коллекцию' }).click();
              assert.equal(await page.locator('dialog.collection').evaluate(dialog => dialog.open), true);
              await page.keyboard.press('Escape');
              assert.equal(await page.locator('dialog.collection').evaluate(dialog => dialog.open), false);
              await page.locator('[data-panel=python] .panel-trigger').hover();
              await page.getByRole('link', { name: 'Открыть справочник' }).click();
              await page.waitForURL('**/python/index.html');
              assert.equal(await page.locator('h1').count(), 1);
              await page.locator('a[href="lessons/environment.html"]').first().click();
              await page.waitForURL('**/python/lessons/environment.html');
              await page.locator('button.copy-code').first().click();
              await page.getByRole('button', { name: /Скопировано|Код выделен/ }).waitFor({ state: 'visible' });
              await visit('/presentation/');
              await page.locator('#root .h-title').first().waitFor({ state: 'attached' });
              await page.getByRole('button', { name: 'Слайды', exact: true }).click();
              const slides = page.locator('nav[aria-label="Слайды"] button');
              assert.equal(await slides.count(), 10);
              await slides.nth(1).click();
              await page.waitForFunction(() => document.querySelector('.counter')?.textContent.startsWith('02'));
              assert.equal(await page.evaluate(() => [...document.fonts].some(face => face.family.includes('Cormorant Garamond'))), true);
              await visit('/');
              await page.locator('[data-panel=project] .panel-trigger').hover();
              const download = page.waitForEvent('download');
              await page.getByRole('link', { name: 'Скачать ZIP' }).click();
              assert.equal((await download).suggestedFilename(), 'qt_meteor_project.zip');
              await page.getByRole('link', { name: /Контрольная сумма ZIP/ }).click();
              await page.waitForURL('**/checksums.txt');
              assert.match(await page.locator('body').textContent(), /[a-f0-9]{64}  qt_meteor_project\.zip/);
              assert.ok(analyticsRequests >= 5);
              assert.deepEqual(errors, []);
              console.log('Collection, Python navigation and clipboard, presentation and fonts, ZIP download and checksum passed.');
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
          node "$RUNNER_TEMP/pages-browser/verify.cjs"
